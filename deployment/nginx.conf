events {}

http {
  upstream xiaodianji_backend {
    server backend:8000;
  }

  upstream xiaodianji_frontend {
    server frontend:80;
  }

  server {
    listen 80;
    client_max_body_size 20m;

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
    }
  }
}
