services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xiaodianji
      POSTGRES_USER: xiaodianji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaodianji -d xiaodianji"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xiaodianji}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_OBJECT_STORAGE_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/evidences
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xiaodianji}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_OBJECT_STORAGE_PASSWORD}

  backend:
    build:
      context: ./backend
    environment:
      XDJ_APP_ENV: demo
      XDJ_DATABASE_URL: postgresql+psycopg://xiaodianji:${POSTGRES_PASSWORD:-CHANGE_ME_DATABASE_PASSWORD}@postgres:5432/xiaodianji
      XDJ_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      XDJ_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-xiaodianji}
      XDJ_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_OBJECT_STORAGE_PASSWORD}
      XDJ_OBJECT_STORAGE_BUCKET: evidences
      XDJ_LLM_PROVIDER: ${XDJ_LLM_PROVIDER:-fake}
      XDJ_LLM_URL: ${XDJ_LLM_URL:-}
      XDJ_LLM_API_KEY: ${XDJ_LLM_API_KEY:-}
      XDJ_LLM_MODEL: ${XDJ_LLM_MODEL:-}
      XDJ_ASR_PROVIDER: ${XDJ_ASR_PROVIDER:-fake}
      XDJ_ASR_URL: ${XDJ_ASR_URL:-}
      XDJ_ASR_API_KEY: ${XDJ_ASR_API_KEY:-}
      XDJ_ASR_MODEL: ${XDJ_ASR_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SHOP_ID: 00000000-0000-0000-0000-000000000101
        VITE_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${XDJ_HTTP_PORT:-8080}:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
