[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaodianji-backend"
version = "0.1.0"
description = "小店记 MVP 后端服务"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "rapidfuzz>=3.10,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

